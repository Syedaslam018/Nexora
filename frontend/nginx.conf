# Serves the built SPA and proxies API/WebSocket traffic to the backend
# container by its docker-compose service name ("backend") — inside the
# compose network, that name resolves via Docker's internal DNS the same
# way "localhost:4000" would on a host machine.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hardening. `always` also applies these headers to
    # error responses instead of only successful asset requests.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client-side routing (React Router) — any path that isn't a real file
    # falls back to index.html so deep links (e.g. /products/some-slug)
    # don't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO's handshake starts as plain HTTP before upgrading to a
    # WebSocket — the Upgrade/Connection headers below are what make nginx
    # forward that upgrade instead of just the initial request (same
    # requirement as vite.config.ts's dev-server proxy).
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Static asset caching — hashed filenames (Vite's default build output)
    # are safe to cache aggressively since a content change means a new
    # filename, not a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
